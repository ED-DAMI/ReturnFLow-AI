[project]
name = "returnflow-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ED-DAMI", email = "mohamed.eddami@usmba.ac.ma" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.5.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "tavily-python>=0.3.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
returnflow-ai = "returnflow_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
